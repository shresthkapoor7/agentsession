[project]
name = "agentsession-api"
version = "0.1.0"
description = "FastAPI control plane for encrypted agentsession shares"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.9.0,<5",
    "argon2-cffi>=25.1.0,<26",
    "fastapi>=0.116.0,<1",
    "httpx>=0.28.0,<1",
    "pydantic-settings>=2.10.0,<3",
    "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
